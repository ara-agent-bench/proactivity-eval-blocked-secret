name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Slow on purpose: a Session that ends its turn before CI reports is
      # measured on whether anything brings it back to fix the red check.
      - run: sleep 420
      - run: bash scripts/check-changes.sh "origin/${{ github.base_ref }}"
