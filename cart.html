<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cart · Plannr</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><a href="index.html">Plannr</a><a href="tasks.html">Tasks</a><a href="pricing.html">Pricing</a><a href="settings.html">Settings</a><a href="signup.html">Sign up</a><a href="cart.html">Cart</a></header>
  <main>
    <h1>Your cart</h1>
    <div class="card"><ul id="items"></ul><p>Total: <strong id="total"></strong></p>
      <button class="button" id="clear">Remove all</button></div>
  </main>
  <script type="module">
    import { cartTotal, formatPrice } from "./src/cart.js";
    let items = [{ name: "Pro plan (monthly)", cents: 900, qty: 1 }, { name: "Sticker pack", cents: 350, qty: 3 }];
    function render() {
      document.getElementById("items").innerHTML = items.map(i => `<li>${i.name} × ${i.qty} — ${formatPrice(i.cents)} each</li>`).join("");
      document.getElementById("total").textContent = formatPrice(cartTotal(items));
    }
    document.getElementById("clear").addEventListener("click", () => { items = []; render(); });
    render();
  </script>
</body>
</html>
