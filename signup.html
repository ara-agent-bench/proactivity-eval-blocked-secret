<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up · Plannr</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><a href="index.html">Plannr</a><a href="tasks.html">Tasks</a><a href="pricing.html">Pricing</a><a href="settings.html">Settings</a><a href="signup.html">Sign up</a><a href="cart.html">Cart</a></header>
  <main>
    <h1>Create your account</h1>
    <form class="card" id="signup-form">
      <div class="field"><label for="email">Email</label><input id="email" name="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password"></div>
      <div class="field"><label for="age">Age</label><input id="age" name="age"></div>
      <p id="signup-error" role="alert"></p>
      <div class="actions"><button type="submit" class="button">Sign up</button></div>
    </form>
  </main>
  <script type="module">
    import { submitSignup } from "./src/signup.js";
    const form = document.getElementById("signup-form");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const result = submitSignup(Object.fromEntries(new FormData(form)));
      document.getElementById("signup-error").textContent = result.ok ? "Welcome!" : result.error;
    });
  </script>
</body>
</html>
